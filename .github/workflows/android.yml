name: Build signed Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: woofcare-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: "Source Code/app"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.3
          cache: true

      - name: Validate release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          set -euo pipefail

          missing=()
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            GOOGLE_MAPS_ANDROID_API_KEY
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required Actions secrets: %s\n' "${missing[*]}" >&2
            exit 64
          fi

          if [[ ! "${GOOGLE_MAPS_ANDROID_API_KEY}" =~ ^[A-Za-z0-9_-]+$ ]]; then
            printf '%s\n' 'GOOGLE_MAPS_ANDROID_API_KEY contains unexpected characters.' >&2
            exit 64
          fi

      - name: Restore Android release signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" \
            | base64 --decode > android/app/woofcare-release.jks

          {
            printf 'storePassword=%s\n' "${ANDROID_KEYSTORE_PASSWORD}"
            printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD}"
            printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS}"
            printf '%s\n' 'storeFile=woofcare-release.jks'
          } > android/key.properties

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build signed release artifacts
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          set -euo pipefail
          flutter build apk --release
          flutter build appbundle --release

      - name: Verify and collect release artifacts
        run: |
          set -euo pipefail

          build_tools_version="$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)"
          "${ANDROID_HOME}/build-tools/${build_tools_version}/apksigner" verify \
            --verbose build/app/outputs/flutter-apk/app-release.apk

          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/release/woofcare-android-release.apk
          cp build/app/outputs/bundle/release/app-release.aab \
            build/release/woofcare-android-release.aab
          sha256sum build/release/*

      - name: Remove signing material
        if: ${{ always() }}
        run: |
          rm -f android/key.properties android/app/woofcare-release.jks

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: woofcare-android-release
          path: "Source Code/app/build/release"
          if-no-files-found: error
          retention-days: 14
