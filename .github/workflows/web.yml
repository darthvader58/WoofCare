name: Build and deploy Flutter web

on:
  pull_request:
    paths:
      - "Source Code/app/**"
      - ".github/workflows/web.yml"
  push:
    branches:
      - main
    paths:
      - "Source Code/app/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: woofcare-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: "Source Code/app"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.3
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build pull request release bundle
        if: github.event_name == 'pull_request'
        run: flutter build web --release

      - name: Build deployable release bundle
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_WEB_VAPID_KEY: ${{ secrets.FIREBASE_WEB_VAPID_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: bash tool/build_web.sh --release

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: woofcare-web
          path: "Source Code/app/build/web"
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download release bundle
        uses: actions/download-artifact@v5
        with:
          name: woofcare-web
          path: build/web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=woofcare --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
